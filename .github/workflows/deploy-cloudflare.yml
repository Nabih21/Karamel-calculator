name: Deploy Karamel to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: karamel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          for key in CF_API_TOKEN CF_ACCOUNT_ID APP_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret for ${key}."
              exit 1
            fi
          done
      - name: Run regression tests
        run: npm test
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Migrate shared overhead (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('wrangler.jsonc')).d1_databases[0].database_name)")
          npx wrangler d1 execute "$DB_NAME" --remote --file migrations/0002_standard_overhead.sql
      - name: Deploy Worker and static interface
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Configure app password securely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: printf '%s' "$APP_PASSWORD" | npx wrangler secret put APP_PASSWORD
