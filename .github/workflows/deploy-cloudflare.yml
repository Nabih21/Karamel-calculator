name: Deploy Karamel to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          for key in CF_API_TOKEN CF_ACCOUNT_ID NOTION_TOKEN APP_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret for ${key}."
              exit 1
            fi
          done
          if [ "${#APP_PASSWORD}" -lt 12 ]; then
            echo "::error::APP_PASSWORD must have at least 12 characters."
            exit 1
          fi
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy Worker and static interface
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Configure Notion API credential securely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: printf '%s' "$NOTION_TOKEN" | npx wrangler secret put NOTION_TOKEN
      - name: Configure app password securely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: printf '%s' "$APP_PASSWORD" | npx wrangler secret put APP_PASSWORD
