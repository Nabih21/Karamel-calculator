name: Deploy verified D1 migration
on:
  workflow_dispatch:
    inputs:
      migration_run:
        description: Successful import workflow run ID
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: karamel-production
  cancel-in-progress: false
jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify migration run
        env:
          RUN_ID: ${{ inputs.migration_run }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/run.json
          node -e 'const r=require("/tmp/run.json");if(r.conclusion!=="success"||r.path!==".github/workflows/migrate-d1.yml"||r.head_branch!=="main")throw Error("Not a successful main migration")'
      - uses: actions/download-artifact@v4
        with:
          name: d1-deployment-config
          path: verified-config
          run-id: ${{ inputs.migration_run }}
          github-token: ${{ github.token }}
      - name: Validate and persist D1 configuration
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('verified-config/wrangler.migration.json'));
          if(c.name!=='karamel-calculator'||c.vars?.DATA_BACKEND!=='d1'||!c.d1_databases?.[0]?.database_id)throw Error('Invalid D1 configuration');
          fs.writeFileSync('wrangler.jsonc',JSON.stringify(c,null,2)+'\n');
          JS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wrangler.jsonc
          git diff --cached --quiet || git commit -m 'Switch production to reconciled D1 database'
          git push origin HEAD:main
      - run: npm test
      - run: npm install --no-save --package-lock=false wrangler@4.162.0
      - run: npx wrangler deploy
      - name: Verify live health and authenticated data
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          const j=await r.json();if(!j.success)throw Error('Cannot discover Worker address');
          const base=`https://karamel-calculator.${j.result.subdomain}.workers.dev`;
          const health=await fetch(base+'/health');assert.equal(health.status,200);assert.equal((await health.json()).configured,true);
          const response=await fetch(base+'/api/data',{headers:{'X-Karamel-Password':process.env.APP_PASSWORD}});assert.equal(response.status,200);
          const data=await response.json();for(const key of ['ingredients','packaging','recipes','recipeIngredients','recipePackaging','overhead'])assert.ok(Array.isArray(data[key]));
          const ui=await fetch(base);assert.equal(ui.status,200);assert.match(await ui.text(),/Karamel Studio/);
          console.log('Live health, UI, and authenticated D1 reads passed:',base);
          JS
